name: 축제 정보 갱신

# 축제 일정과 사진은 해마다 바뀐다. 연 1회(1월 5일) 자동 갱신하고,
# 필요할 때 수동으로도 돌릴 수 있게 workflow_dispatch를 열어둔다.
on:
  schedule:
    - cron: "0 18 4 1 *"      # 매년 1월 5일 03:00 KST (UTC 기준 1월 4일 18:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # secrets는 스텝의 if에서 못 읽는다. 잡 레벨 env로 올려야 조건에 쓸 수 있다.
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install pillow

      - name: TourAPI에서 축제 일정·사진 받기
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          # data.go.kr은 해외 IP에서 연결이 자주 끊긴다(러너에서 절반 넘게 실패).
          # 서울 리전 프록시를 거쳐 국내에서 나가게 한다.
          TOUR_PROXY_URL: ${{ secrets.TOUR_PROXY_URL }}
          TOUR_PROXY_SECRET: ${{ secrets.TOUR_PROXY_SECRET }}
        run: python fetch_tourapi_photos.py

      - name: 사진 내려받기
        run: python download_festival_photos.py

      - name: 큰 사진 줄이기
        run: |
          python - <<'PY'
          import os
          from PIL import Image
          D, MAXW, LIMIT = "festival_photos", 480, 150 * 1024
          for f in sorted(os.listdir(D)):
              p = os.path.join(D, f)
              if os.path.getsize(p) <= LIMIT:
                  continue
              im = Image.open(p)
              w, h = im.size
              if w > MAXW:
                  im = im.resize((MAXW, round(h * MAXW / w)), Image.LANCZOS)
              im.save(p, quality=82, optimize=True)
              print(f"{f}: {os.path.getsize(p)//1024}KB")
          PY

      - name: 페이지 빌드
        run: python build_page.py

      - name: 바뀐 내용 확인
        id: diff
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "바뀐 내용 없음"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: 커밋 및 푸시
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "축제 일정·사진 자동 갱신 (TourAPI)"
          git push

      # Vercel이 이 저장소에 연결돼 있어 위 푸시만으로 배포가 이어진다.
      # 연결이 끊겼을 때를 대비해, VERCEL_TOKEN 시크릿이 있으면 CLI로도 배포한다.
      - name: 배포 (연결이 끊겼을 때만)
        if: steps.diff.outputs.changed == 'true' && env.VERCEL_TOKEN != ''
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"

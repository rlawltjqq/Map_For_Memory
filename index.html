<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나의 여행 지도</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#3b9c6e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="여행지도">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: #f4f6f9; color: #1f2937; height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    letter-spacing: -0.01em;
  }
  button { font-family: inherit; }
  input { font-family: inherit; }
  .icon { width: 1.15em; height: 1.15em; vertical-align: -0.2em; flex-shrink: 0; }

  /* ---- 랜딩 ---- */
  #landing { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
  #landing .card {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 32px 28px;
    width: 100%; max-width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,.05);
  }
  #landing h1 { font-size: 22px; text-align: center; }
  #landing .desc { font-size: 13px; color: #6b7280; text-align: center; margin: 6px 0 22px; }
  #landing h3 { font-size: 13px; color: #6b7280; margin: 16px 0 8px; }
  #landing input {
    width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid #d1d5db;
    border-radius: 8px; margin-bottom: 8px;
  }
  #landing .primary {
    width: 100%; padding: 10px; font-size: 14px; font-weight: 600; border: none;
    border-radius: 8px; background: #3b9c6e; color: #fff; cursor: pointer;
  }
  #landing .primary:hover { background: #2f7d58; }
  .err { font-size: 12.5px; color: #b91c1c; margin-top: 6px; min-height: 16px; }
  #myRooms a {
    display: block; padding: 9px 12px; border: 1px solid #e5e7eb; border-radius: 8px;
    margin-bottom: 6px; font-size: 14px; color: #1f2937; text-decoration: none;
  }
  #myRooms a:hover { background: #f3f4f6; }
  #landing .tip { font-size: 12px; color: #9ca3af; margin-top: 16px; text-align: center; }

  /* ---- 앱 ---- */
  #app { flex: 1; display: none; flex-direction: column; min-height: 0; }
  header {
    padding: 10px 16px; background: #fff; border-bottom: 1px solid #e5e7eb;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  header h1 { font-size: 17px; }
  #roomName { font-size: 15px; font-weight: 700; color: #1f2937; }
  header .hbtn {
    font-size: 12px; padding: 5px 11px; border-radius: 999px; cursor: pointer;
    border: 1px solid #e2e8f0; background: #fff; color: #475569;
  }
  header .hbtn:hover { background: #f1f5f9; border-color: #cbd5e1; }
  #searchWrap { position: relative; margin-left: 8px; }
  #searchWrap .search-ic { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; pointer-events: none; }
  #searchInput {
    width: 190px; font-size: 13px; padding: 6px 10px 6px 28px; border: 1px solid #e2e8f0;
    border-radius: 999px; color: #374151; background: #fff;
  }
  #searchInput:focus { outline: none; border-color: #3b9c6e; width: 220px; }
  #searchResults {
    position: absolute; left: 0; top: calc(100% + 5px); width: 260px; max-height: 320px;
    overflow-y: auto; background: #fff; border: 1px solid #e5e7eb; border-radius: 10px;
    box-shadow: 0 6px 20px rgba(0,0,0,.1); z-index: 20; display: none; padding: 4px;
  }
  #searchResults.show { display: block; }
  .sr-item {
    display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 7px;
    cursor: pointer; font-size: 13px;
  }
  .sr-item.active, .sr-item:hover { background: #f1f7f3; }
  .sr-item img { width: 20px; height: 20px; object-fit: contain; flex-shrink: 0; }
  .sr-item .sr-prov { color: #9ca3af; font-size: 11.5px; margin-left: auto; }
  .sr-item .sr-visited { color: #3b9c6e; font-size: 11px; }
  #searchResults .sr-empty { padding: 10px; text-align: center; color: #9ca3af; font-size: 12.5px; }
  #syncBadge { font-size: 12px; padding: 3px 10px; border-radius: 999px; margin-left: auto; }
  #syncBadge::before {
    content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: currentColor; margin-right: 6px; vertical-align: 1px;
  }
  #syncBadge.on { background: #dcf5e8; color: #1a7a4d; }
  #syncBadge.off { background: #fee2e2; color: #b91c1c; }
  .layout { flex: 1; display: flex; min-height: 0; }
  .map-wrap {
    flex: 1; position: relative; overflow: hidden; touch-action: none;
    background: linear-gradient(180deg, #eaf2fa 0%, #f4f6f9 100%);
  }
  .mapsvg { width: 100%; height: 100%; display: block; cursor: grab; }
  .mapsvg.dragging { cursor: grabbing; }
  .mapsvg.hidden { display: none; }
  /* 나라 전환 */
  .cswitch {
    display: flex; gap: 4px; background: rgba(255,255,255,.93);
    border: 1px solid #e5e7eb; border-radius: 999px; padding: 3px;
  }
  .cswitch button {
    border: none; background: none; padding: 5px 12px; border-radius: 999px;
    font-size: 12.5px; color: #6b7280; cursor: pointer;
  }
  .cswitch button.active { background: #3b9c6e; color: #fff; font-weight: 600; }
  #countrySwitch { position: absolute; top: 10px; right: 14px; z-index: 6; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .aside-cswitch { width: max-content; margin: 12px auto 2px; }
  /* 경계선을 줌과 무관하게 항상 얇게 (non-scaling-stroke) */
  .g-munis path {
    transition: fill .15s; cursor: pointer;
    vector-effect: non-scaling-stroke; stroke-width: 0.7px;
  }
  .g-munis path:hover { fill: #e3f2e9; }
  .g-munis path.visited { fill: #b7e4c7; }
  .g-munis path.visited:hover { fill: #a4dcb8; }
  .g-munis path.selected { stroke: #2d6a4f; stroke-width: 1.8px; }
  .g-provinces path { vector-effect: non-scaling-stroke; stroke-width: 1.3px; }
  .g-labels text.on-visited { fill: #1b4332; }
  .g-labels text.sel-label { fill: #14532d; font-weight: 700; }
  .zoom-btns { position: absolute; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
  .zoom-btns button {
    width: 38px; height: 38px; border: 1px solid #d1d5db; background: #fff; border-radius: 8px;
    font-size: 18px; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .zoom-btns button:hover { background: #f3f4f6; }
  aside {
    width: 310px; background: #fff; border-left: 1px solid #e5e7eb;
    padding: 16px; overflow-y: auto; flex-shrink: 0;
  }
  .big-stat { text-align: center; }
  .big-stat .pct { font-size: 40px; font-weight: 700; color: #3b9c6e; }
  .big-stat .cnt { font-size: 13px; color: #6b7280; margin-top: 2px; }
  .total-bar { height: 8px; background: #e5e7eb; border-radius: 4px; overflow: hidden; margin: 10px 0 14px; }
  .total-bar > div { height: 100%; background: #3b9c6e; border-radius: 4px; width: 0; transition: width .3s; }
  h2 { font-size: 12.5px; color: #6b7280; font-weight: 600; margin: 14px 0 8px; }

  #regionPanel { border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px; background: #fafbfc; }
  #regionPanel .hint { font-size: 12.5px; color: #9ca3af; text-align: center; padding: 6px 0; }
  #rpHead { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  #rpEmblem {
    width: 34px; height: 34px; object-fit: contain; display: none;
    background: #fff; border: 1px solid #eef0f3; border-radius: 8px; padding: 2px;
  }
  #rpName { font-size: 15px; font-weight: 700; }
  #rpProv { font-size: 12px; color: #6b7280; }
  #rpToggle {
    margin-left: auto; font-size: 12px; padding: 5px 10px; border-radius: 999px; cursor: pointer;
    border: 1px solid #d1d5db; background: #fff; color: #374151; white-space: nowrap;
  }
  #rpToggle.v { background: #3b9c6e; border-color: #3b9c6e; color: #fff; }
  #photoGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
  #photoGrid .ph { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; cursor: pointer; }
  #photoGrid img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #photoGrid .del {
    position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%;
    background: rgba(0,0,0,.55); color: #fff; border: none; font-size: 12px; line-height: 1;
    cursor: pointer; display: none;
  }
  #photoGrid .ph:hover .del { display: block; }
  #uploadMsg { font-size: 11.5px; color: #9ca3af; text-align: center; margin-top: 6px; }
  /* 방문 기록 (여러 번 방문 지원) */
  .sec-head {
    font-size: 11.5px; font-weight: 600; color: #9ca3af; margin: 12px 0 6px;
  }
  .visit-card {
    border: 1px solid #e8ecf0; border-radius: 10px; padding: 9px 10px;
    margin-bottom: 7px; background: #fff;
  }
  .visit-top { display: flex; align-items: center; gap: 5px; margin-bottom: 5px; }
  .visit-top .dlabel { font-size: 11.5px; color: #6b7280; font-weight: 600; }
  .visit-top .dlabel em { font-style: normal; font-weight: 400; color: #b6bcc5; font-size: 10.5px; }
  .visit-dates { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .visit-card input[type=date] {
    flex: 1; min-width: 0; font-size: 13px; border: 1px solid #e2e8f0;
    border-radius: 7px; padding: 7px 8px; color: #374151; background: #fff;
  }
  .visit-card .tilde { color: #9ca3af; font-size: 13px; flex-shrink: 0; }
  .visit-card textarea {
    width: 100%; font-size: 13px; border: 1px solid #e2e8f0; border-radius: 7px;
    padding: 7px 8px; color: #374151; background: #fff; resize: vertical; line-height: 1.4;
  }
  .visit-card input:focus, .visit-card textarea:focus { outline: none; border-color: #3b9c6e; }
  .visit-del {
    margin-left: auto; width: 24px; height: 24px; border: none; background: #f3f4f6;
    color: #9ca3af; border-radius: 50%; font-size: 12px; cursor: pointer; flex-shrink: 0;
  }
  .visit-del:hover { background: #fee2e2; color: #b91c1c; }
  /* 방문별 사진 */
  .v-photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 5px; margin: 7px 0; }
  .v-photos .ph { position: relative; aspect-ratio: 1; border-radius: 7px; overflow: hidden; }
  .v-photos img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: pointer; }
  .v-photos .del {
    position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%;
    background: rgba(0,0,0,.55); color: #fff; border: none; font-size: 10px; line-height: 1;
    cursor: pointer; display: none;
  }
  .v-photos .ph:hover .del, .v-photos .ph:hover .mv { display: block; }
  .v-photos .mv {
    position: absolute; bottom: 2px; left: 2px; padding: 1px 5px; border-radius: 5px;
    background: rgba(0,0,0,.55); color: #fff; border: none; font-size: 9.5px;
    cursor: pointer; display: none;
  }
  /* 모바일은 hover가 없으므로 항상 노출 */
  @media (hover: none) {
    .v-photos .del, .v-photos .mv { display: block; }
  }
  /* 사진 이동 선택창 */
  #movePicker {
    position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none;
    align-items: center; justify-content: center; z-index: 40; padding: 20px;
  }
  #movePicker.show { display: flex; }
  #movePicker .card {
    background: #fff; border-radius: 14px; padding: 18px; width: 100%; max-width: 340px;
    max-height: 70vh; overflow-y: auto;
  }
  #movePicker h3 { font-size: 15px; margin-bottom: 12px; }
  #moveList button {
    display: block; width: 100%; text-align: left; padding: 10px 12px; margin-bottom: 6px;
    border: 1px solid #e5e7eb; border-radius: 9px; background: #fff; font-size: 13px;
    color: #374151; cursor: pointer;
  }
  #moveList button:hover { background: #f1f7f3; border-color: #3b9c6e; }
  #moveList button.cur { background: #f1f7f3; border-color: #3b9c6e; color: #2d6a4f; font-weight: 600; }
  #moveList .mv-memo { display: block; font-size: 11.5px; color: #9ca3af; margin-top: 2px; }
  #moveCancel {
    width: 100%; padding: 9px; margin-top: 4px; border: none; border-radius: 9px;
    background: #f3f4f6; color: #4b5563; font-size: 13px; cursor: pointer;
  }
  /* 전체 초기화 / 지도 삭제 확인 */
  #resetModal, #delModal {
    position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none;
    align-items: center; justify-content: center; z-index: 45; padding: 20px;
  }
  #resetModal.show, #delModal.show { display: flex; }
  #resetModal .card, #delModal .card { background: #fff; border-radius: 14px; padding: 20px; width: 100%; max-width: 340px; }
  #resetModal h3, #delModal h3 { font-size: 16px; margin-bottom: 8px; }
  #resetModal p, #delModal p { font-size: 12.5px; color: #6b7280; line-height: 1.55; margin-bottom: 12px; }
  #resetPw, #delPw {
    width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid #d1d5db;
    border-radius: 8px; margin-bottom: 4px;
  }
  #resetPw:focus, #delPw:focus { outline: none; border-color: #b91c1c; }
  .rm-btns { display: flex; gap: 8px; margin-top: 8px; }
  .rm-btns button { flex: 1; padding: 10px; font-size: 13.5px; border-radius: 9px; cursor: pointer; border: none; }
  #resetCancel, #delCancel { background: #f3f4f6; color: #4b5563; }
  #resetConfirm, #delConfirm { background: #b91c1c; color: #fff; font-weight: 600; }
  #resetConfirm:disabled, #delConfirm:disabled { opacity: .6; cursor: default; }
  .v-addphoto {
    width: 100%; padding: 7px; font-size: 12px; border: 1px dashed #d7dde5;
    border-radius: 7px; background: #fff; color: #6b7280; cursor: pointer;
  }
  .v-addphoto:hover { background: #f1f7f3; border-color: #3b9c6e; color: #2d6a4f; }
  .add-visit {
    width: 100%; padding: 8px; font-size: 12.5px; border: 1px dashed #cbd5e1;
    border-radius: 8px; background: #fff; color: #4b5563; cursor: pointer;
  }
  .add-visit:hover { background: #f1f7f3; border-color: #3b9c6e; color: #2d6a4f; }
  #visitList:empty + .add-visit { border-color: #9ca3af; }
  /* 여행 통계 카드 */
  /* 가볼 만한 곳 추천 */
  #recHead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #recMonth {
    font-size: 12px; font-weight: 400; padding: 4px 6px; border: 1px solid #e5e7eb;
    border-radius: 7px; background: #fff; color: #4b5563;
  }
  #recNote { font-size: 11.5px; color: #9ca3af; margin-bottom: 8px; line-height: 1.5; }
  #recList { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
  .rec-card {
    display: flex; align-items: center; gap: 9px; padding: 9px 11px; background: #fff;
    border: 1px solid #eef1f4; border-radius: 11px; cursor: pointer; text-align: left;
  }
  .rec-card:hover { border-color: #cfe3d8; background: #fbfdfc; }
  .rec-card img { width: 26px; height: 26px; object-fit: contain; flex: none; }
  .rec-main { flex: 1; min-width: 0; }
  .rec-name { font-size: 13.5px; font-weight: 600; color: #1f2937; }
  .rec-why { font-size: 11.5px; color: #6b7280; margin-top: 1px; }
  .rec-num { flex: none; text-align: right; font-size: 11.5px; color: #6b7280; line-height: 1.45; }
  .rec-num b { display: block; font-size: 14px; color: #2d6a4f; font-weight: 700; }
  /* 이달의 축제 */
  #fesHead { font-size: 13.5px; font-weight: 700; color: #374151; margin: 4px 0 3px; }
  #fesNote { font-size: 11.5px; color: #9ca3af; margin-bottom: 8px; line-height: 1.5; }
  #fesList { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
  .fes-card {
    display: flex; align-items: center; gap: 9px; padding: 9px 11px; background: #fff;
    border: 1px solid #eef1f4; border-radius: 11px; cursor: pointer; text-align: left;
  }
  .fes-card:hover { border-color: #cfe3d8; background: #fbfdfc; }
  .fes-tag {
    flex: none; font-size: 10.5px; font-weight: 600; color: #2d6a4f; background: #eaf5ef;
    border-radius: 6px; padding: 3px 6px; min-width: 38px; text-align: center;
  }
  .fes-photo {
    flex: none; width: 54px; height: 54px; object-fit: cover; border-radius: 8px;
    background: #f3f4f6;
  }
  .fes-main { flex: 1; min-width: 0; }
  .fes-name { font-size: 13px; font-weight: 600; color: #1f2937; }
  .fes-sub { font-size: 11.5px; color: #6b7280; margin-top: 1px; }
  .fes-when { flex: none; font-size: 11px; color: #9ca3af; }
  .fes-card.done .fes-name::after { content: " · 다녀옴"; color: #2d6a4f; font-weight: 500; font-size: 11px; }
  #feedFilter { display: flex; gap: 6px; margin-bottom: 10px; }
  #feedSearch {
    flex: 1; min-width: 0; padding: 8px 11px; font-size: 13px; border: 1px solid #e5e7eb;
    border-radius: 9px; background: #fff; color: #1f2937;
  }
  #feedSearch:focus { outline: none; border-color: #3b9c6e; }
  #feedYear {
    flex: none; padding: 8px 9px; font-size: 13px; border: 1px solid #e5e7eb;
    border-radius: 9px; background: #fff; color: #4b5563;
  }
  #feedEmpty { font-size: 13px; color: #9ca3af; text-align: center; padding: 22px 0; }
  #statsCards { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  #statsCards:empty { display: none; }
  #statsCards:empty + #feedHead { margin-top: 12px; }
  .stat-card {
    background: #fafbfc; border: 1px solid #eef0f3; border-radius: 11px; padding: 10px 11px;
  }
  .stat-card.wide { grid-column: 1 / -1; }
  .stat-card .sc-label { font-size: 11px; color: #9ca3af; margin-bottom: 3px; }
  .stat-card .sc-value { font-size: 17px; font-weight: 700; color: #1f2937; line-height: 1.25; }
  .stat-card .sc-sub { font-size: 11.5px; color: #6b7280; margin-top: 2px; }
  .stat-card .sc-value em { font-style: normal; color: #2d6a4f; }
  /* 여행 앨범 (기록 탭) */
  #memoryFeed:empty::after {
    content: "아직 남긴 기록이 없어요.\A지역을 눌러 사진·메모를 남겨보세요.";
    white-space: pre; display: block; text-align: center; color: #9ca3af;
    font-size: 12.5px; padding: 14px 0; line-height: 1.6;
  }
  .mem-card {
    border: 1px solid #eef0f3; border-radius: 12px; padding: 11px 12px; margin-bottom: 10px;
    background: #fafbfc; cursor: pointer; transition: background .12s, border-color .12s;
  }
  .mem-card:hover { background: #f1f7f3; border-color: #cde6d8; }
  .mem-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .mem-head img { width: 26px; height: 26px; object-fit: contain; }
  .mem-title { font-size: 13.5px; font-weight: 700; color: #1f2937; }
  .mem-prov { font-size: 11px; color: #9ca3af; }
  .mem-count {
    margin-left: auto; font-size: 11px; color: #2d6a4f; background: #dcf5e8;
    padding: 2px 8px; border-radius: 999px; flex-shrink: 0;
  }
  .mem-visit { display: flex; gap: 7px; font-size: 12.5px; line-height: 1.5; margin-bottom: 5px; }
  .mem-vdate { color: #2d6a4f; font-weight: 600; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .mem-vmemo { color: #4b5563; white-space: pre-wrap; min-width: 0; }
  .mem-photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 5px; }
  .mem-photos img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 7px; cursor: pointer; }
  /* 첫 방문 안내 */
  #firstHint {
    position: absolute; left: 50%; top: 18px; transform: translateX(-50%); z-index: 6;
    background: rgba(31,41,55,.92); color: #fff; font-size: 13px; line-height: 1.5;
    padding: 10px 16px; border-radius: 12px; text-align: center; max-width: 82%;
    box-shadow: 0 4px 16px rgba(0,0,0,.18); display: none;
  }
  #firstHint b { color: #8fe3b8; }
  #firstHint .x {
    display: inline-block; margin-top: 6px; font-size: 11.5px; color: #cbd5e1;
    text-decoration: underline; cursor: pointer;
  }

  .prov-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 2.5px 0; }
  .prov-row .name { width: 34px; color: #374151; }
  .prov-row .bar { flex: 1; height: 6px; background: #eef0f3; border-radius: 3px; overflow: hidden; }
  .prov-row .bar > div { height: 100%; background: #7fc9a4; border-radius: 3px; }
  .prov-row.done .bar > div { background: #3b9c6e; }
  .prov-row .num { width: 46px; text-align: right; color: #9ca3af; font-variant-numeric: tabular-nums; }
  .btns { display: flex; gap: 8px; margin-top: 16px; }
  .btns button {
    flex: 1; padding: 8px 0; font-size: 13px; border-radius: 8px; cursor: pointer;
    border: 1px solid #e2e8f0; background: #fff; color: #475569;
  }
  .btns button:hover { background: #f1f5f9; border-color: #cbd5e1; }
  .btns #resetBtn, .btns #deleteMapBtn { color: #b91c1c; border-color: #fecaca; }
  .btns #resetBtn:hover, .btns #deleteMapBtn:hover { background: #fef2f2; }
  #myRooms .room-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  #myRooms .room-row a { flex: 1; margin-bottom: 0; }
  #myRooms .room-forget {
    flex: none; width: 34px; height: 34px; border: 1px solid #e5e7eb; border-radius: 8px;
    background: #fff; color: #9ca3af; font-size: 16px; line-height: 1; cursor: pointer;
  }
  #myRooms .room-forget:hover { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
  #tooltip {
    position: fixed; pointer-events: none; background: rgba(31,41,55,.92); color: #fff;
    font-size: 12.5px; padding: 5px 10px; border-radius: 6px; display: none; z-index: 10;
    white-space: nowrap;
  }
  #tooltip .v { color: #8fe3b8; }
  #lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none;
    align-items: center; justify-content: center; z-index: 20; cursor: zoom-out;
  }
  #lightbox img {
    max-width: 92vw; max-height: 92vh; border-radius: 6px;
    touch-action: none; user-select: none; -webkit-user-drag: none;
    transform-origin: center center; will-change: transform;
  }
  #lightbox.zoomed { cursor: grab; }
  #lightbox.zoomed img { border-radius: 0; }
  #lbZoomHint {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 12px; background: rgba(0,0,0,.45);
    padding: 4px 12px; border-radius: 999px; display: none;
  }
  #lightbox.zoomed #lbZoomHint { display: block; }
  .lb-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 44px; height: 64px; border: none; border-radius: 10px;
    background: rgba(255,255,255,.14); color: #fff; font-size: 30px; line-height: 1;
    cursor: pointer; display: none;
  }
  .lb-nav:hover { background: rgba(255,255,255,.26); }
  #lbPrev { left: 12px; }
  #lbNext { right: 12px; }
  #lightbox.multi .lb-nav { display: block; }
  #lbCount {
    position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 12.5px; background: rgba(0,0,0,.45);
    padding: 4px 12px; border-radius: 999px; display: none;
  }
  #lightbox.multi #lbCount { display: block; }
  /* 확대 중에는 넘기기 버튼·장수 숨김 (화면 이동에 집중) — .multi 규칙보다 뒤에 와야 적용됨 */
  #lightbox.zoomed .lb-nav, #lightbox.zoomed #lbCount,
  #lightbox.multi.zoomed .lb-nav, #lightbox.multi.zoomed #lbCount { display: none; }
  @media (max-width: 720px) {
    /* 모바일은 스와이프 위주 — 화살표는 작게 */
    .lb-nav { width: 36px; height: 52px; font-size: 24px; background: rgba(255,255,255,.10); }
  }

  /* ---- 암호 입력 모달 ---- */
  #joinModal {
    position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none;
    align-items: center; justify-content: center; z-index: 30;
  }
  #joinModal .card {
    background: #fff; border-radius: 14px; padding: 26px 24px; width: 90%; max-width: 340px;
  }
  #joinModal h3 { font-size: 16px; margin-bottom: 4px; }
  #joinModal p { font-size: 12.5px; color: #6b7280; margin-bottom: 14px; }
  #joinModal input {
    width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid #d1d5db;
    border-radius: 8px; margin-bottom: 8px;
  }
  #joinModal button {
    width: 100%; padding: 10px; font-size: 14px; font-weight: 600; border: none;
    border-radius: 8px; background: #3b9c6e; color: #fff; cursor: pointer;
  }

  /* ---- 모바일: 하단 탭 + 바텀시트 ---- */
  #tabbar { display: none; }
  #mapStatPill { display: none; }
  #rpClose { display: none; }
  @media (max-width: 720px) {
    aside { display: none; }
    /* 모바일 헤더: 검색을 둘째 줄 전체 폭으로 */
    #roomName { order: 1; }
    #inviteBtn { order: 2; }
    #saveBtn { order: 3; }
    #leaveBtn { order: 4; }
    #syncBadge { order: 5; }
    #searchWrap { order: 6; margin-left: 0; width: 100%; flex-basis: 100%; }
    #searchInput, #searchInput:focus { width: 100%; }
    #searchResults { width: 100%; }
    header .hbtn { font-size: 11.5px; padding: 4px 9px; }
    body.tab-stats .map-wrap { display: none; }
    body.tab-stats aside {
      display: block; width: 100%; max-height: none; flex: 1; border-left: none;
    }
    /* 모바일에서는 추천과 기록이 서로 다른 화면 — 한쪽만 보인다 */
    body.tab-rec #feedSection { display: none; }
    body.tab-stats:not(.tab-rec) #recSection { display: none; }
    .big-stat .pct { font-size: 34px; }
    #tabbar { display: flex; background: #fff; border-top: 1px solid #e5e7eb; flex-shrink: 0; }
    #tabbar button {
      flex: 1; padding: 8px 0; padding-bottom: max(8px, env(safe-area-inset-bottom));
      font-size: 11.5px; border: none; background: none; color: #9ca3af; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
    }
    #tabbar button .icon { width: 22px; height: 22px; }
    #tabbar button.active { color: #3b9c6e; font-weight: 600; }
    #mapStatPill {
      display: block; position: absolute; top: 10px; left: 10px; z-index: 5;
      background: rgba(255,255,255,.93); border: 1px solid #e5e7eb; border-radius: 999px;
      padding: 6px 13px; font-size: 12.5px; color: #374151; cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    #mapStatPill b { color: #3b9c6e; }
    /* 지역 상세 패널 = 바텀시트 */
    body.is-mobile #regionPanel {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
      background: #fff; border: none; border-top: 1px solid #e5e7eb;
      border-radius: 16px 16px 0 0; box-shadow: 0 -6px 24px rgba(0,0,0,.15);
      max-height: 62%; overflow-y: auto;
      padding: 14px 16px; padding-bottom: max(14px, env(safe-area-inset-bottom));
      transform: translateY(110%); transition: transform .25s;
    }
    body.is-mobile #regionPanel.open { transform: translateY(0); }
    body.is-mobile #regionPanel .hint { display: none; }
    #rpClose {
      display: block; margin-left: 8px; width: 28px; height: 28px; border-radius: 50%;
      border: none; background: #f3f4f6; color: #6b7280; font-size: 13px; cursor: pointer;
      flex-shrink: 0;
    }
  }
</style>
</head>
<body>

<div id="landing">
  <div class="card">
    <h1><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#3b9c6e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3.5 6v14L9 18l6 2 5.5-2V4L15 6 9 4Z"/><path d="M9 4v14"/><path d="M15 6v14"/></svg> 나의 여행 지도</h1>
    <div class="desc">가본 시·군·구를 함께 색칠하고 사진을 남겨요</div>
    <h3>새 지도 만들기</h3>
    <input id="newName" placeholder="지도 이름 (예: 우리 가족 여행지도)" maxlength="40">
    <input id="newPw" type="password" placeholder="공유 암호 (4자 이상)">
    <button class="primary" id="createBtn">지도 만들기</button>
    <div class="err" id="createErr"></div>
    <div id="myRoomsWrap" style="display:none">
      <h3>내 지도</h3>
      <div id="myRooms"></div>
    </div>
    <div class="tip">초대받았다면 받은 링크로 접속한 뒤 암호를 입력하세요.</div>
  </div>
</div>

<div id="app">
  <header>
    <h1><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#3b9c6e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3.5 6v14L9 18l6 2 5.5-2V4L15 6 9 4Z"/><path d="M9 4v14"/><path d="M15 6v14"/></svg></h1>
    <span id="roomName"></span>
    <div id="searchWrap">
      <svg class="icon search-ic" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="searchInput" type="text" placeholder="지역 검색 (예: 경주)" autocomplete="off">
      <div id="searchResults"></div>
    </div>
    <button class="hbtn" id="inviteBtn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 13.5a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1.2 1.2"/><path d="M13.5 10.5a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1.2-1.2"/></svg> 초대 링크 복사</button>
    <button class="hbtn" id="saveBtn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m8 11 4 4 4-4"/><path d="M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2"/></svg> 지도 저장</button>
    <button class="hbtn" id="leaveBtn">지도 목록</button>
    <span id="syncBadge" class="on"></span>
  </header>
  <div class="layout">
    <div class="map-wrap" id="mapWrap">
      <div id="countrySwitch" class="cswitch">
        <button data-country="kr" class="active">🇰🇷 한국</button>
        <button data-country="jp">🇯🇵 일본</button>
      </div>
      <!-- 지도 SVG는 용량이 커서(387KB) 별도 파일로 받는다.
           HTML은 network-first라 인라인이면 열 때마다 다시 받게 된다. -->
      <div id="mapHost"></div>
      <div class="zoom-btns">
        <button id="zoomIn" title="확대">+</button>
        <button id="zoomOut" title="축소">−</button>
        <button id="zoomReset" title="원래대로" style="font-size:13px">⟲</button>
      </div>
      <button id="mapStatPill"></button>
      <div id="firstHint">가본 지역을 <b>눌러</b> 색칠하고<br>사진·메모로 추억을 남겨보세요<br><span class="x" id="firstHintClose">알겠어요</span></div>
    </div>
    <aside>
      <div class="big-stat">
        <div class="pct" id="pct">0%</div>
        <div class="cnt"><span id="cnt">0</span> / <span id="total">0</span> <span id="unitLabel">시·군·구</span></div>
      </div>
      <div class="total-bar"><div id="totalBar"></div></div>
      <div class="cswitch aside-cswitch">
        <button data-country="kr" class="active">🇰🇷 한국</button>
        <button data-country="jp">🇯🇵 일본</button>
      </div>

      <div id="regionPanel">
        <div class="hint" id="rpHint">지도에서 지역을 클릭하면<br>사진을 추가할 수 있어요</div>
        <div id="rpBody" style="display:none">
          <div id="rpHead">
            <img id="rpEmblem" alt="">
            <div><div id="rpName"></div><div id="rpProv"></div></div>
            <button id="rpToggle"></button>
            <button id="rpClose" title="닫기">✕</button>
          </div>
          <div class="sec-head">방문 기록</div>
          <div id="visitList"></div>
          <button class="add-visit" id="addVisitBtn">+ 방문 추가</button>
          <div class="sec-head" id="unassignedHead" style="display:none">방문일 미지정 사진</div>
          <div id="photoGrid"></div>
          <input type="file" id="photoInput" accept="image/*" multiple hidden>
          <div id="uploadMsg"></div>
        </div>
      </div>

      <div id="recSection">
        <h2 id="recHead">가볼 만한 곳
          <select id="recMonth"></select>
        </h2>
        <div id="recNote"></div>
        <div id="recList"></div>

        <h3 id="fesHead">이달의 축제</h3>
        <div id="fesNote"></div>
        <div id="fesList"></div>
      </div>

      <div id="feedSection">
      <h2 id="statsCardHead">여행 통계</h2>
      <div id="statsCards"></div>

      <h2 id="feedHead">여행 앨범</h2>
      <div id="feedFilter">
        <input id="feedSearch" type="search" placeholder="지역명·메모 검색" autocomplete="off">
        <select id="feedYear"><option value="">전체 기간</option></select>
      </div>
      <div id="feedEmpty" style="display:none"></div>
      <div id="memoryFeed"></div>

      <h2 id="statsHead">시·도별 달성률</h2>
      <div id="provList"></div>
      <div class="btns">
        <button id="backupBtn">데이터 백업</button>
        <button id="restoreBtn">백업 불러오기</button>
        <input id="restoreFile" type="file" accept="application/json,.json" hidden>
        <button id="resetBtn">방문 표시 초기화</button>
        <button id="deleteMapBtn">지도 삭제</button>
      </div>
      </div>
    </aside>
  </div>
  <nav id="tabbar">
    <button id="tabMap" class="active"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3.5 6v14L9 18l6 2 5.5-2V4L15 6 9 4Z"/><path d="M9 4v14"/><path d="M15 6v14"/></svg>지도</button>
    <button id="tabRec"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 14.4 9l5.6.5-4.3 3.9 1.3 5.6L12 16l-5 3 1.3-5.6L4 9.5 9.6 9Z"/></svg>추천</button>
    <button id="tabStats"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20v-7"/><path d="M12 20V6"/><path d="M19 20V9"/></svg>기록</button>
  </nav>
</div>

<div id="joinModal">
  <div class="card">
    <h3 id="joinTitle">지도 입장</h3>
    <p>이 지도의 공유 암호를 입력하세요.</p>
    <input id="joinPw" type="password" placeholder="공유 암호" autocomplete="off">
    <button id="joinBtn">입장하기</button>
    <div class="err" id="joinErr"></div>
  </div>
</div>

<div id="tooltip"></div>
<div id="lightbox">
  <img alt="">
  <button id="lbPrev" class="lb-nav" aria-label="이전 사진">‹</button>
  <button id="lbNext" class="lb-nav" aria-label="다음 사진">›</button>
  <div id="lbCount"></div>
  <div id="lbZoomHint">두 번 탭하면 원래대로</div>
</div>
<div id="movePicker">
  <div class="card">
    <h3>어느 방문의 사진인가요?</h3>
    <div id="moveList"></div>
    <button id="moveCancel">취소</button>
  </div>
</div>
<div id="delModal">
  <div class="card">
    <h3>지도 삭제</h3>
    <p id="delDesc"></p>
    <input type="password" id="delPw" placeholder="지도 비밀번호" autocomplete="current-password">
    <div class="err" id="delErr"></div>
    <div class="rm-btns">
      <button id="delCancel">취소</button>
      <button id="delConfirm">삭제</button>
    </div>
  </div>
</div>
<div id="resetModal">
  <div class="card">
    <h3>방문 표시 초기화</h3>
    <p id="resetDesc"></p>
    <input type="password" id="resetPw" placeholder="지도 비밀번호" autocomplete="current-password">
    <div class="err" id="resetErr"></div>
    <div class="rm-btns">
      <button id="resetCancel">취소</button>
      <button id="resetConfirm">초기화</button>
    </div>
  </div>
</div>

<script>
// 지도 SVG를 먼저 받아 넣은 뒤 앱을 켠다. 앱 코드가 DOM에 지도가 있다고 보고 시작하기 때문.
(function () {
  var host = document.getElementById("mapHost");
  function boot() {
    var s = document.createElement("script");
    s.src = "app.js?v=ae4056a1";
    document.body.appendChild(s);
  }
  Promise.all([
    fetch("map_kr.svg?v=ae4056a1").then(function (r) { return r.text(); }),
    fetch("map_jp.svg?v=ae4056a1").then(function (r) { return r.text(); })
  ]).then(function (parts) {
    host.innerHTML = parts[0] + parts[1];
    boot();
  }).catch(function () {
    host.innerHTML = '<p style="padding:24px;color:#6b7280;font-size:14px">지도를 불러오지 못했습니다. 새로고침해 주세요.</p>';
  });
})();
</script>
</body>
</html>
